<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gold Fx</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; margin: 0; background: #0a0a0a; }
    .splash { position: fixed; inset: 0; z-index: 100; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
    .splash.hide { opacity: 0; pointer-events: none; }
    .logo-x {
      width: 88px; height: 88px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 40%, #0ea5e9 100%);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 42px; font-weight: 800; color: white;
      box-shadow: 0 0 40px rgba(249, 115, 22, 0.35);
      position: relative;
    }
    .logo-x::after {
      content: '↗';
      position: absolute; top: 8px; right: 10px;
      font-size: 18px; opacity: 0.9;
    }
    .progress-track { width: 160px; height: 3px; background: #1e293b; border-radius: 2px; overflow: hidden; margin-top: 28px; }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #f97316, #38bdf8); animation: load 1.4s ease-out forwards; }
    @keyframes load { to { width: 100%; } }
    .auth-card { max-width: 400px; width: 100%; }
    .tab-active { background: #1e293b; color: #fff; }
    .tab-inactive { background: transparent; color: #94a3b8; }
    .input-field {
      width: 100%; background: #111827; border: 1px solid #1f2937; border-radius: 12px;
      padding: 14px 16px 14px 44px; color: #f1f5f9; font-size: 15px; outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus { border-color: #f97316; }
    .input-field::placeholder { color: #64748b; }
    .btn-primary {
      width: 100%; background: #f97316; color: #fff; font-weight: 600; font-size: 16px;
      padding: 14px; border-radius: 12px; border: none; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover { background: #ea580c; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-google {
      width: 100%; background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
      font-weight: 500; padding: 13px; border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background 0.2s;
    }
    .btn-google:hover { background: #334155; }
  </style>
</head>
<body class="min-h-screen text-slate-100">

  <div id="splash" class="splash">
    <img src="logo-icon.svg" alt="Gold Fx" width="96" height="96" style="border-radius:22px;box-shadow:0 0 40px rgba(249,115,22,0.4)">
    <p class="mt-6 text-lg font-semibold tracking-wide">Opening Gold Fx</p>
    <div class="progress-track"><div class="progress-bar"></div></div>
  </div>

  <div id="authScreen" class="min-h-screen flex flex-col relative z-10">
    <header class="flex items-center justify-between px-4 py-3 border-b border-slate-800/80">
      <div class="flex items-center gap-2">
        <img src="logo-icon.svg" alt="Gold Fx" class="w-8 h-8 rounded-lg">
        <span class="font-bold text-base tracking-tight">GOLD FX</span>
      </div>
      <div class="flex items-center gap-1.5 text-xs text-emerald-400">
        <i class="fas fa-shield-halved"></i>
        <span>Secure access</span>
      </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-8">
      <div class="auth-card">
        <div class="flex justify-center mb-5">
          <div class="w-14 h-14 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center">
            <i class="fas fa-user text-2xl text-sky-400"></i>
          </div>
        </div>

        <h1 class="text-2xl font-bold text-center mb-1">Welcome back</h1>
        <p class="text-sm text-slate-400 text-center mb-6">Sign in to your private market workspace.</p>

        <div class="flex rounded-xl bg-slate-900 border border-slate-800 p-1 mb-5">
          <button type="button" id="tabSignIn" onclick="setTab('signin')" class="flex-1 py-2.5 rounded-lg text-sm font-medium tab-active transition">Sign in</button>
          <button type="button" id="tabRegister" onclick="setTab('register')" class="flex-1 py-2.5 rounded-lg text-sm font-medium tab-inactive transition">Register</button>
        </div>

        <button type="button" onclick="loginGoogle()" class="btn-google mb-5">
          <span class="w-5 h-5 rounded-full bg-white text-slate-900 text-xs font-bold flex items-center justify-center">G</span>
          Continue with Google
        </button>

        <div class="flex items-center gap-3 mb-5">
          <div class="flex-1 h-px bg-slate-800"></div>
          <span class="text-xs text-slate-500">or use email</span>
          <div class="flex-1 h-px bg-slate-800"></div>
        </div>

        <form id="authForm" onsubmit="return handleAuth(event)" class="space-y-4">
          <div id="nameField" class="hidden">
            <label class="block text-xs text-slate-400 mb-1.5">Name</label>
            <div class="relative">
              <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
              <input id="nameInput" type="text" class="input-field" placeholder="Your name" autocomplete="name">
            </div>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1.5">Email</label>
            <div class="relative">
              <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
              <input id="emailInput" type="email" class="input-field" placeholder="you@example.com" autocomplete="email">
            </div>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1.5">Password</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
              <input id="passInput" type="password" class="input-field" placeholder="Enter your password" autocomplete="current-password">
              <button type="button" onclick="togglePass()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
                <i id="passIcon" class="fas fa-eye text-sm"></i>
              </button>
            </div>
          </div>
          <div class="flex items-center justify-between text-xs">
            <label class="flex items-center gap-2 text-slate-400 cursor-pointer">
              <input id="remember" type="checkbox" class="rounded border-slate-600 bg-slate-800 text-orange-500">
              Remember email
            </label>
            <button type="button" onclick="alert('Contact admin to reset password')" class="text-sky-400 hover:underline">Forgot password?</button>
          </div>
          <button type="submit" class="btn-primary mt-2">
            <span id="submitLabel">Sign in</span> →
          </button>
        </form>

        <p class="text-center text-xs text-slate-600 mt-8">Gold Fx · Private workspace · server.py</p>
      </div>
    </main>
  </div>

  <script>
    let mode = 'signin';
    window.addEventListener('load', () => {
      if (typeof GFX !== 'undefined' && GFX.isLoggedIn()) {
        window.location.href = 'dashboard.html';
        return;
      }
      const saved = localStorage.getItem('gfx_remember_email');
      if (saved) {
        document.getElementById('emailInput').value = saved;
        document.getElementById('remember').checked = true;
      }
      setTimeout(() => document.getElementById('splash').classList.add('hide'), 1500);
    });
    function setTab(m) {
      mode = m;
      const si = document.getElementById('tabSignIn');
      const reg = document.getElementById('tabRegister');
      const nameField = document.getElementById('nameField');
      const label = document.getElementById('submitLabel');
      if (m === 'signin') {
        si.className = 'flex-1 py-2.5 rounded-lg text-sm font-medium tab-active transition';
        reg.className = 'flex-1 py-2.5 rounded-lg text-sm font-medium tab-inactive transition';
        nameField.classList.add('hidden');
        label.textContent = 'Sign in';
      } else {
        reg.className = 'flex-1 py-2.5 rounded-lg text-sm font-medium tab-active transition';
        si.className = 'flex-1 py-2.5 rounded-lg text-sm font-medium tab-inactive transition';
        nameField.classList.remove('hidden');
        label.textContent = 'Register';
      }
    }
    function togglePass() {
      const inp = document.getElementById('passInput');
      const icon = document.getElementById('passIcon');
      if (inp.type === 'password') { inp.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
      else { inp.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
    }
    function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const name = document.getElementById('nameInput').value.trim();
      const remember = document.getElementById('remember').checked;
      if (!email) { alert('Please enter email'); return false; }
      if (mode === 'register' && !name) { alert('Please enter your name'); return false; }
      if (remember) localStorage.setItem('gfx_remember_email', email);
      else localStorage.removeItem('gfx_remember_email');
      const displayName = mode === 'register' && name ? name : (email.split('@')[0] || 'Trader');
      GFX.login(email, displayName);
      window.location.href = 'dashboard.html';
      return false;
    }
    function loginGoogle() {
      GFX.login('google.user@goldfx.app', 'Google User');
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
