<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gold Fx — Admin Signals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="border-b border-slate-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-500 to-yellow-600 flex items-center justify-center font-bold text-sm">G</div>
      <div>
        <span class="font-bold">Gold<span class="text-amber-400"> Fx</span></span>
        <span class="text-xs text-slate-500 ml-2">Admin · Signal Feed</span>
      </div>
    </div>
    <a href="dashboard.html" class="text-sm text-amber-400 hover:underline">← Back to Office</a>
  </header>

  <main class="max-w-4xl mx-auto p-6">
    <h1 class="text-xl font-semibold mb-6">Post Live Signal</h1>

    <form id="signalForm" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-8 space-y-4">
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Symbol</label>
          <select id="symbol" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm">
            <option>XAUUSD</option>
            <option>BTCUSD</option>
            <option>EURUSD</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Direction</label>
          <select id="direction" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm">
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
          </select>
        </div>
      </div>
      <div class="grid sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Entry</label>
          <input id="entry" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" placeholder="2652.40">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">SL</label>
          <input id="sl" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" placeholder="2641.00">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">TP</label>
          <input id="tp" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" placeholder="2675.00">
        </div>
      </div>
      <div class="grid sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">RR</label>
          <input id="rr" type="number" step="0.1" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" placeholder="2.0">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Confidence %</label>
          <input id="confidence" type="number" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" value="70">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Status</label>
          <select id="status" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm">
            <option value="active">Active</option>
            <option value="watch">Watch</option>
            <option value="closed">Closed</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Notes</label>
        <input id="notes" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" placeholder="Optional note">
      </div>
      <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 rounded-xl transition">
        Publish Signal
      </button>
    </form>

    <h2 class="font-semibold mb-4">Current Feed</h2>
    <div id="list" class="space-y-3"></div>
  </main>

  <script>
    async function loadList() {
      const res = await fetch('/api/signals');
      const data = await res.json();
      const list = data.signals || [];
      const el = document.getElementById('list');
      if (!list.length) {
        el.innerHTML = '<p class="text-slate-500 text-sm">No signals yet.</p>';
        return;
      }
      el.innerHTML = list.map(s => `
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-wrap items-center justify-between gap-3">
          <div>
            <span class="text-xs ${s.direction === 'BUY' ? 'text-emerald-400' : 'text-red-400'} font-medium">${s.direction}</span>
            <span class="font-semibold ml-2">${s.symbol}</span>
            <span class="text-xs text-slate-500 ml-2">${s.status}</span>
            <div class="text-xs text-slate-400 mt-1">E ${s.entry} · SL ${s.sl} · TP ${s.tp} · RR ${s.rr}</div>
          </div>
          <div class="flex gap-2">
            <button onclick="setStatus('${s.id}','closed')" class="text-xs px-3 py-1.5 rounded-lg border border-slate-700 hover:border-slate-500">Close</button>
            <button onclick="del('${s.id}')" class="text-xs px-3 py-1.5 rounded-lg text-red-400 border border-red-500/30 hover:bg-red-500/10">Delete</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('signalForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        symbol: document.getElementById('symbol').value,
        direction: document.getElementById('direction').value,
        entry: document.getElementById('entry').value,
        sl: document.getElementById('sl').value,
        tp: document.getElementById('tp').value,
        rr: document.getElementById('rr').value,
        confidence: document.getElementById('confidence').value,
        status: document.getElementById('status').value,
        notes: document.getElementById('notes').value
      };
      const res = await fetch('/api/signals', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (res.ok) {
        e.target.reset();
        document.getElementById('confidence').value = 70;
        loadList();
        alert('Signal published!');
      } else {
        alert('Failed to publish');
      }
    });

    async function setStatus(id, status) {
      await fetch('/api/signals/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      loadList();
    }
    async function del(id) {
      if (!confirm('Delete signal?')) return;
      await fetch('/api/signals/' + id, { method: 'DELETE' });
      loadList();
    }
    loadList();
  </script>
</body>
</html>
